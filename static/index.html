<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F2F Spread Terminal</title>
<style>
/* Self-hosted fonts (latin subset, variable) — no external requests */
@font-face {
  font-family: 'JetBrains Mono';
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url('/static/fonts/jetbrains-mono-latin.woff2') format('woff2');
}
@font-face {
  font-family: 'DM Sans';
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url('/static/fonts/dm-sans-latin.woff2') format('woff2');
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-primary: #0a0e17;
  --bg-secondary: #111827;
  --bg-tertiary: #1a2236;
  --bg-elevated: #1e293b;
  --bg-hover: #243044;
  --border: #1e3a5f;
  --border-subtle: #162032;
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent: #38bdf8;
  --accent-dim: #0c4a6e;
  --green-bg: #052e16;
  --green-text: #4ade80;
  --green-bright: #22c55e;
  --red-bg: #2a0a0a;
  --red-text: #f87171;
  --red-bright: #ef4444;
  --amber-text: #fbbf24;
  --cyan-text: #22d3ee;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
  --font-sans: 'DM Sans', -apple-system, sans-serif;
  --frozen-width: 168px;
  --row-height: 36px;
  --header-height: 40px;
}

html, body { height: 100%; overflow: hidden; }

body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 12px;
  -webkit-font-smoothing: antialiased;
}

#root { height: 100%; display: flex; flex-direction: column; }

/* ── TOP BAR ── */
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 20px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}

.topbar-brand {
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: 15px;
  color: var(--accent);
  letter-spacing: -0.3px;
  white-space: nowrap;
}

.topbar-stats {
  display: flex;
  gap: 20px;
  font-size: 11px;
  color: var(--text-muted);
}

.topbar-stat span { color: var(--text-secondary); font-weight: 500; }

.topbar-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green-bright);
  animation: pulse-dot 2s ease-in-out infinite;
  flex-shrink: 0;
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
  50% { opacity: 0.7; box-shadow: 0 0 0 4px rgba(34, 197, 94, 0); }
}

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

/* ── SEARCH ── */
.search-wrap {
  position: relative;
  width: 220px;
}

.search-wrap svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
}

.search-input {
  width: 100%;
  padding: 7px 12px 7px 32px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border-subtle);
  border-radius: 6px;
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 12px;
  outline: none;
  transition: border-color 0.15s;
}

.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--text-muted); }

/* ── EXPORT BTN ── */
.btn-export {
  padding: 7px 14px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border-subtle);
  border-radius: 6px;
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.btn-export:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border); }

/* ── TABLE CONTAINER ── */
.table-viewport {
  flex: 1;
  overflow: hidden;
  position: relative;
}

.table-scroll {
  height: 100%;
  overflow: auto;
  padding-left: var(--frozen-width);
}

.table-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
.table-scroll::-webkit-scrollbar-track { background: var(--bg-primary); }
.table-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.table-scroll::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
.table-scroll::-webkit-scrollbar-corner { background: var(--bg-primary); }

/* ── TABLE ── */
table {
  border-collapse: separate;
  border-spacing: 0;
  width: max-content;
  min-width: 100%;
}

/* ── HEADER ── */
thead { position: sticky; top: 0; z-index: 20; background: var(--bg-secondary); }
thead tr { background: var(--bg-secondary); }

thead th {
  height: var(--header-height);
  padding: 0 10px;
  background: var(--bg-secondary);
  border-bottom: 2px solid var(--border);
  color: #ffffff;
  font-weight: 500;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  position: relative;
  transition: color 0.12s;
}

thead th:hover { color: var(--accent); }
thead th.sorted { color: var(--accent); }
thead th .sort-arrow { font-size: 9px; margin-left: 3px; opacity: 0.8; }

/* Column group headers */
thead tr.col-groups th {
  height: 26px;
  font-size: 9px;
  letter-spacing: 1.2px;
  color: #ffffff;
  border-bottom: 1px solid var(--border-subtle);
  cursor: default;
}

.col-group-info { background: var(--bg-secondary); }
.col-group-ltp { background: rgba(56, 189, 248, 0.06); }
.col-group-near-next { background: rgba(168, 85, 247, 0.06); }
.col-group-next-far { background: rgba(251, 191, 36, 0.06); }
.col-group-near-far { background: rgba(34, 211, 238, 0.06); }

/* ── BODY ── */
tbody tr {
  height: var(--row-height);
  transition: background 0.08s;
}

tbody tr:hover { background: var(--bg-hover) !important; }
tbody tr:nth-child(even) { background: rgba(255,255,255,0.01); }

td {
  padding: 0 10px;
  border-bottom: 1px solid var(--border-subtle);
  white-space: nowrap;
  text-align: right;
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
}

td.sym-cell {
  text-align: left;
  font-weight: 600;
  color: var(--text-primary);
}

/* ── FROZEN COLUMN ── */
.frozen-col {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--frozen-width);
  z-index: 30;
  background: var(--bg-primary);
  border-right: 1px solid var(--border);
  overflow: hidden;
  pointer-events: none;
}

.frozen-col table { width: var(--frozen-width); }

.frozen-col thead th {
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  pointer-events: auto;
  cursor: pointer;
}

.frozen-col tr.col-groups th {
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
}

.frozen-col td {
  background: var(--bg-primary);
  border-right: 1px solid var(--border);
}

.frozen-col tbody tr:nth-child(even) td { background: rgba(255,255,255,0.01); }
.frozen-col tbody tr:hover td { background: var(--bg-hover); }

/* ── SPREAD CELLS ── */
td.spread-pos { color: var(--green-text); background: var(--green-bg); }
td.spread-neg { color: var(--red-text); background: var(--red-bg); }
td.pct-pos { color: var(--green-text); }
td.pct-neg { color: var(--red-text); }
td.ltp-cell { color: var(--amber-text); }

/* ── BOTTOM BAR ── */
.bottombar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 20px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border-subtle);
  font-size: 11px;
  color: var(--text-muted);
  flex-shrink: 0;
}

.bottombar kbd {
  display: inline-block;
  padding: 1px 5px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border-subtle);
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-secondary);
  margin: 0 2px;
}

/* ── CHART BUTTON COLUMN (frozen) ── */
.frozen-col th.chart-col-head { width: 36px; padding: 0; border-right: none; }
.frozen-col td.chart-cell {
  width: 36px;
  padding: 0;
  text-align: center;
  border-right: none;
  pointer-events: auto;
}
.chart-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px; height: 24px;
  padding: 0;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 5px;
  color: var(--text-muted);
  cursor: pointer;
  pointer-events: auto;
  transition: all 0.12s;
}
.chart-btn:hover { color: var(--accent); background: var(--accent-dim); border-color: var(--border); }

/* ── MODAL ── */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(3, 6, 12, 0.72);
  backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.modal {
  width: min(1040px, 96vw);
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.55);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 14px 18px;
  background: var(--bg-tertiary);
  border-bottom: 1px solid var(--border-subtle);
}
.modal-title { display: flex; align-items: center; gap: 10px; color: var(--accent); }
.modal-sym {
  font-family: var(--font-sans);
  font-weight: 600; font-size: 17px;
  color: var(--text-primary); letter-spacing: -0.2px;
}
.modal-sub { font-size: 11px; color: var(--text-muted); }
.modal-controls { display: flex; align-items: center; gap: 10px; }
.seg { display: flex; background: var(--bg-primary); border: 1px solid var(--border-subtle); border-radius: 7px; padding: 2px; }
.seg-btn {
  padding: 5px 12px;
  background: transparent; border: none; border-radius: 5px;
  color: var(--text-secondary);
  font-family: var(--font-mono); font-size: 11px;
  cursor: pointer; transition: all 0.12s; white-space: nowrap;
}
.seg-btn:hover { color: var(--text-primary); }
.seg-btn.active { background: var(--accent); color: #04121f; font-weight: 600; }
.btn-ghost {
  padding: 6px 12px;
  background: var(--bg-primary); border: 1px solid var(--border-subtle); border-radius: 6px;
  color: var(--text-secondary); font-family: var(--font-mono); font-size: 11px;
  cursor: pointer; transition: all 0.12s; white-space: nowrap;
}
.btn-ghost:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border); }
.btn-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px;
  background: var(--bg-primary); border: 1px solid var(--border-subtle); border-radius: 6px;
  color: var(--text-secondary); cursor: pointer; transition: all 0.12s;
}
.btn-icon:hover { background: var(--red-bg); color: var(--red-text); border-color: var(--red-bright); }
.modal-body { padding: 12px 16px 6px; background: var(--bg-primary); }
.modal-foot {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 18px;
  background: var(--bg-tertiary);
  border-top: 1px solid var(--border-subtle);
  font-size: 11px; color: var(--text-muted);
}

/* ── CHART ── */
.chart-wrap { position: relative; width: 100%; user-select: none; }
.chart-empty {
  height: 430px; display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); font-size: 13px;
}
.grid-line { stroke: var(--border-subtle); stroke-width: 1; }
.zero-line { stroke: var(--text-muted); stroke-width: 1.4; stroke-dasharray: 5 4; opacity: 0.85; }
.zero-label { fill: var(--text-muted); font-size: 10px; font-family: var(--font-mono); }
.axis-label { fill: var(--text-muted); font-size: 10px; font-family: var(--font-mono); }
.axis-title { fill: var(--text-secondary); font-size: 10px; font-family: var(--font-mono); letter-spacing: 0.5px; }

/* cycle legend */
.chart-legend {
  display: flex; flex-wrap: wrap; gap: 4px 12px;
  padding: 2px 4px 8px;
  max-height: 52px; overflow-y: auto;
}
.legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--text-secondary); }
.legend-item i { width: 11px; height: 3px; border-radius: 2px; display: inline-block; }
.hover-line { stroke: var(--accent); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.7; }
.hover-dot { fill: var(--accent); stroke: var(--bg-primary); stroke-width: 1.5; }
.chart-tip {
  position: absolute; z-index: 5; pointer-events: none;
  min-width: 176px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 8px 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  font-size: 11px;
}
.tip-date { font-weight: 600; color: var(--text-primary); margin-bottom: 5px; font-size: 12px; }
.tip-row { display: flex; justify-content: space-between; gap: 14px; line-height: 1.7; }
.tip-row span { color: var(--text-muted); }
.tip-row b { color: var(--text-secondary); font-weight: 500; font-variant-numeric: tabular-nums; }
.tip-spread { margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--border-subtle); }
.tip-spread b.spread-pos { color: var(--green-text); }
.tip-spread b.spread-neg { color: var(--red-text); }
</style>
</head>
<body>
<div id="root"></div>
<script src="/static/app.js" defer></script>
</body>
</html>
